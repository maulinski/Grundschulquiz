<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8e7" />
    <title>Grundschulquiz – Schlaukopf-Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="achievements.css" />
    <link rel="stylesheet" href="sync.css" />
    <script src="questions.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section id="welcome-screen" class="screen active">
        <header class="page-header">
          <div class="brand-mark" aria-hidden="true">⭐</div>
          <p class="eyebrow">Lernen macht Spaß!</p>
          <h1>Schlaukopf-Quiz</h1>
          <p class="intro">Lege ein Profil an und starte das Quiz direkt dort.</p>
        </header>

        <form id="create-profile-form" class="panel create-profile-panel">
          <label class="input-label" for="player-name">Neues Profil</label>
          <div class="input-row">
            <input id="player-name" class="player-input" type="text" maxlength="18" placeholder="Zum Beispiel: Mia" autocomplete="off" />
            <button id="create-profile-btn" class="primary-button compact-button" type="submit" disabled>Profil anlegen</button>
          </div>
          <p id="profile-message" class="profile-message" role="status" aria-live="polite"></p>
        </form>

        <div id="profiles-list" class="profiles-list" aria-live="polite"></div>
      </section>

      <section id="quiz-screen" class="screen hidden">
        <div class="quiz-card" id="quiz-card" aria-labelledby="question">
          <div class="quiz-topline">
            <span class="category" id="category">Allgemeinwissen</span>
            <span class="progress" id="progress">Frage 1 von 10</span>
          </div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
          <h2 id="question" tabindex="-1">Die Frage wird geladen …</h2>
          <p class="instruction">Wähle die richtige Antwort aus:</p>
          <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <button class="primary-button" id="next-btn" type="button" disabled>Antwort prüfen</button>
        </div>
      </section>

      <section id="result-screen" class="screen hidden" aria-live="polite">
        <div class="result-card" id="result">
          <div class="result-star" aria-hidden="true">🏆</div>
          <p class="eyebrow">Runde geschafft!</p>
          <h2 id="result-title">Super gemacht!</h2>
          <p class="result-score" id="score-text"></p>
          <p class="result-message" id="result-message"></p>
          <section id="round-achievement-progress" class="round-achievement-progress" aria-live="polite" aria-label="Erfolge-Fortschritt"></section>
          <button class="primary-button" id="restart-btn" type="button">Noch einmal spielen</button>
          <button class="primary-button" id="home-btn" type="button">Zurück zu den Profilen</button>
        </div>
      </section>
    </main>

    <footer class="sync-dock" aria-label="Geräte-Synchronisierung">
      <form id="jsonbin-config-form" class="sync-connect-form">
        <input id="jsonbin-access-key" type="password" value="$2a$10$Po.yf8K9hxn7aSRuvrPtFOK6OMcXn6uIITG8hSoENstN208Q28H1G" placeholder="JSONbin Access Key" autocomplete="off" aria-label="JSONbin Access Key" />
        <button class="sync-action sync-connect-button" type="submit">Verbinden</button>
      </form>
      <button id="sync-btn" class="sync-action sync-refresh-button" type="button" disabled>Synchronisieren</button>
      <span id="sync-message" class="visually-hidden" role="status" aria-live="polite"></span>
    </footer>
  </body>
</html>
