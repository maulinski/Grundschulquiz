<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8e7" />
    <title>Grundschulquiz – Schlaukopf-Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <script src="questions.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <section id="welcome-screen" class="screen active">
        <header class="page-header">
          <div class="brand-mark" aria-hidden="true">⭐</div>
          <p class="eyebrow">Lernen macht Spaß!</p>
          <h1>Schlaukopf-Quiz</h1>
          <p class="intro">Trage deinen Namen ein und starte dein Quiz.</p>
        </header>

        <div class="panel">
          <label class="input-label" for="player-name">Name</label>
          <input id="player-name" class="player-input" type="text" maxlength="18" placeholder="Zum Beispiel: Mia" />
          <button id="start-btn" class="primary-button" type="button">Quiz starten</button>
        </div>

        <div class="profile-box" id="player-profile-box">
          <div class="profile-header">
            <span>Profil</span>
            <button id="logout-btn" class="text-button" type="button">Abmelden</button>
          </div>
          <div class="profile-grid">
            <div class="stat-item"><span class="stat-label">Name</span><strong id="profile-name">-</strong></div>
            <div class="stat-item"><span class="stat-label">Streak</span><strong id="profile-streak">0</strong></div>
            <div class="stat-item"><span class="stat-label">Runden</span><strong id="profile-rounds">0</strong></div>
            <div class="stat-item"><span class="stat-label">Bestes Ergebnis</span><strong id="profile-best">0/10</strong></div>
          </div>
          <button id="reset-stats-btn" class="secondary-button" type="button">Statistik zurücksetzen</button>
          <button id="delete-profile-btn" class="secondary-button" type="button">Profil löschen</button>
        </div>
      </section>

      <section id="quiz-screen" class="screen hidden">
        <div class="quiz-card" id="quiz-card" aria-labelledby="question">
          <div class="quiz-topline"><span class="category" id="category">Allgemeinwissen</span><span class="progress" id="progress">Frage 1 von 10</span></div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
          <h2 id="question" tabindex="-1">Die Frage wird geladen …</h2>
          <p class="instruction" id="instruction">Wähle die richtige Antwort aus:</p>
          <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <button class="primary-button" id="next-btn" type="button" disabled>Antwort prüfen</button>
        </div>
      </section>

      <section id="result-screen" class="screen hidden" aria-live="polite">
        <div class="result-card" id="result">
          <div class="result-star" aria-hidden="true">🏆</div>
          <p class="eyebrow">Runde geschafft!</p>
          <h2 id="result-title">Super gemacht!</h2>
          <p class="result-score" id="score-text"></p>
          <p class="result-message" id="result-message"></p>
          <button class="primary-button" id="restart-btn" type="button">Noch einmal spielen</button>
          <button class="primary-button" id="home-btn" type="button">Zurück ins Hauptmenü</button>
        </div>
      </section>
    </main>

    <script>
      document.querySelector("#home-btn").addEventListener("click", () => {
        document.querySelector("#result-screen").classList.remove("active");
        document.querySelector("#result-screen").classList.add("hidden");
        document.querySelector("#welcome-screen").classList.remove("hidden");
        document.querySelector("#welcome-screen").classList.add("active");
        document.querySelector("#player-name").focus();
      });
      document.querySelector("#reset-stats-btn").addEventListener("click", () => {
        if (!window.confirm("Möchtest du wirklich alle Statistiken dieses Profils zurücksetzen? Der Profilname bleibt erhalten.")) return;
        try {
          const key = "grundschulquiz-profile";
          const profile = JSON.parse(localStorage.getItem(key) || "{}");
          profile.streak = 0;
          profile.lastPlayedDate = "";
          profile.totalRounds = 0;
          profile.bestScore = 0;
          profile.lastResult = 0;
          localStorage.setItem(key, JSON.stringify(profile));
          document.querySelector("#profile-streak").textContent = "0";
          document.querySelector("#profile-rounds").textContent = "0";
          document.querySelector("#profile-best").textContent = "0/10";
        } catch (error) {
          window.alert("Die Statistik konnte nicht zurückgesetzt werden. Bitte prüfe, ob der Browser lokales Speichern erlaubt.");
        }
      });
      document.querySelector("#delete-profile-btn").addEventListener("click", () => {
        if (!window.confirm("Möchtest du dieses Profil wirklich löschen? Name und alle Statistiken werden entfernt.")) return;
        try {
          localStorage.removeItem("grundschulquiz-profile");
          document.querySelector("#profile-name").textContent = "-";
          document.querySelector("#profile-streak").textContent = "0";
          document.querySelector("#profile-rounds").textContent = "0";
          document.querySelector("#profile-best").textContent = "0/10";
          document.querySelector("#player-name").value = "";
        } catch (error) {
          window.alert("Das Profil konnte nicht gelöscht werden. Bitte prüfe, ob der Browser lokales Speichern erlaubt.");
        }
      });
    </script>
  </body>
</html>
